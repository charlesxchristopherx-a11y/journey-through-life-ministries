<section class="page-banner">
  <div class="wrap">
    <span class="breadcrumb">Prayer Requests</span>
    <h1>You Don't Have to Carry It Alone</h1>
    <p>Share what's on your heart and our prayer team will lift it up. Requests are kept confidential.</p>
  </div>
</section>

<section>
  <div class="wrap">
    <form class="card" action="https://formsubmit.co/support@journeythroughlifeministries.net" method="POST">
      <input type="hidden" name="_subject" value="New Prayer Request">
      <input type="hidden" name="_template" value="box">
      <input type="hidden" name="_captcha" value="true">

      <div class="form-row">
        <label for="name">Your Name</label>
        <input type="text" id="name" name="name" required>
      </div>
      <div class="form-row">
        <label for="email">Email (optional, so we can follow up)</label>
        <input type="email" id="email" name="email">
      </div>
      <div class="form-row">
        <label for="request">Your Prayer Request</label>
        <textarea id="request" name="Prayer Request" rows="6" required></textarea>
      </div>
      <div class="form-row">
        <label style="display:flex; align-items:center; gap:8px; font-weight:500;">
          <input type="checkbox" name="Keep Confidential" value="Yes" style="width:auto;">
          Please keep this request confidential (prayer team only)
        </label>
      </div>
      <button type="submit" class="btn btn-primary">Submit Prayer Request</button>
      <p class="form-note" style="margin-top:14px;">Prefer to talk it through? Call us at <a href="tel:4125838628">412-583-8628</a> or email <a href="mailto:support@journeythroughlifeministries.net">support@journeythroughlifeministries.net</a>.</p>
    </form>
  </div>
</section>
